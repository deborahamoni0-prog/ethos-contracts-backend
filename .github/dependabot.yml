version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 10
    assignees:
      - OxDev-max
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(deps):"
    allow:
      - dependency-type: "all"
    groups:
      # Security advisories: include minor bumps so patched versions are picked up
      security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
      # Routine version updates: patch-only to minimise breaking-change risk
      regular-updates:
        applies-to: version-updates
        update-types:
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    assignees:
      - OxDev-max
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps):"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
