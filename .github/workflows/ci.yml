name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned (not @stable): newer rustc releases reject an unsound transmute
      # in ethnum 1.5.2 (a transitive Soroban SDK dependency) with E0512, which
      # broke every CI run once rustc moved past 1.96.x. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build crate
        run: cargo build --package ttl-vault --lib

      - name: Run tests
        run: cargo test --package ttl-vault

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --package ttl-vault -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings

      - name: Scan for secrets with Gitleaks
        # gitleaks/gitleaks-action@v2 now gates organization repos behind a
        # paid license (unrelated to this codebase - CI never ran long enough
        # to reach this step before). The underlying gitleaks CLI is still
        # free/open-source, so install and run it directly instead.
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

      - name: Validate OpenAPI specification
        run: |
          if command -v spectacle &> /dev/null; then
            spectacle docs/openapi.yaml
          fi
          python3 -m pip install openapi-spec-validator 2>/dev/null || true
          if command -v openapi-spec-validator &> /dev/null; then
            openapi-spec-validator docs/openapi.yaml
          fi

      - name: Check version consistency
        run: |
          CHANGELOG_VERSION=$(grep -m 1 "^## \[" CHANGELOG.md | sed -E 's/## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          LIB_VERSION=$(grep -oE 'DataKey::Version.*"([0-9]+\.[0-9]+\.[0-9]+)"' contracts/ttl_vault/src/lib.rs | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$CHANGELOG_VERSION" != "$LIB_VERSION" ]; then
            echo "Version mismatch: CHANGELOG ($CHANGELOG_VERSION) != lib.rs ($LIB_VERSION)"
            exit 1
          fi

  backend:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    # The backend persists reminder preferences, subscriptions, 2FA config,
    # and audit trails to Postgres (see backend/src/db.rs). A real Postgres
    # instance is required to build confidence that migrations and queries
    # are valid, and to run the test suite (each test opens an isolated
    # schema on this instance via Db::open_isolated).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ethos_user
          POSTGRES_PASSWORD: ethos_password
          POSTGRES_DB: ethos_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ethos_user -d ethos_protocol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ethos_user:ethos_password@localhost:5432/ethos_protocol
      TEST_DATABASE_URL: postgres://ethos_user:ethos_password@localhost:5432/ethos_protocol
    steps:
      - uses: actions/checkout@v4

      # Pinned to match the contracts job (see comment above) so both jobs
      # build against the same toolchain.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-backend-

      - name: Build backend
        run: cargo build --package ethos-protocol-backend

      - name: Run backend tests
        run: cargo test --package ethos-protocol-backend

      - name: Run clippy (backend)
        run: cargo clippy --package ethos-protocol-backend --all-targets -- -D warnings
