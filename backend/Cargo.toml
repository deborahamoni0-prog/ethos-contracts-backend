[package]
name = "ethos-protocol-backend"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"

# Axum HTTP server (used by legacy preference + reminder API)
axum = { version = "0.7", features = ["macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

env_logger = "0.11"
thiserror = "1"
csv = "1"

# Postgres used by the axum DB contract (Db::open/migrate/upsert/get/all).
# Async (tokio-postgres + bb8) rather than the sync `postgres`/`r2d2` crates:
# the sync client bridges to async internally by spinning up its own tokio
# runtime, which panics ("Cannot start a runtime from within a runtime") the
# moment it's invoked from a thread already driving a tokio runtime -- which
# is always the case here, since every caller (axum handlers, `main`, the
# background scheduler) runs on the app's own tokio runtime.
# `with-chrono-0_4` lets timestamp columns bind directly to/from
# `chrono::DateTime<Utc>`; `with-serde_json-1` lets JSONB columns bind
# directly to/from `serde_json::Value`.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
bb8 = "0.8"
bb8-postgres = "0.8"

# Push notifications (FCM via HTTP v1 API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JWT authentication for WebSocket connections
jsonwebtoken = "9"

# Distributed cache for multi-node consensus checks
redis = "0.27"

# Two-factor authentication (HMAC-based TOTP implemented directly in two_factor.rs)
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.4"

